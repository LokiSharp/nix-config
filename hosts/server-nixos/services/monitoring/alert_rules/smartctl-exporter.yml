groups:
  - name: SmartctlExporter
    rules:
      - alert: SmartctlExporterDown
        expr: 'up{job=~"smartctl-exporter-.+"} == 0'
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: SMART exporter unavailable (instance {{ $labels.instance }})
          description:
            "SMART metrics have been unavailable for five minutes.\n  HOST = {{ $labels.host }}\n
            INSTANCE = {{ $labels.instance }}"

      - alert: SmartDeviceUnhealthy
        expr: "smartctl_device_smart_status == 0"
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: SMART reports an unhealthy disk (instance {{ $labels.instance }})
          description:
            "A disk failed its SMART health assessment.\n  HOST = {{ $labels.host }}\n  DEVICE =
            {{ $labels.device }}"

      - alert: SmartctlNoDevices
        expr: "smartctl_devices == 0"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SMART exporter found no disks (instance {{ $labels.instance }})
          description:
            "Disk health monitoring is enabled, but no supported disks were discovered.\n  HOST =
            {{ $labels.host }}\n  INSTANCE = {{ $labels.instance }}"
