name: Nix Flake Eval Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check expressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-eval-v1-${{ runner.os }}-${{ hashFiles('flake.lock', 'ci/mysecrets/**') }}
          restore-prefixes-first-match: nix-eval-v1-${{ runner.os }}-

      - name: Run Nix Flake Eval Tests
        run: |
          nix --accept-flake-config --quiet eval \
            --override-input mysecrets path:./ci/mysecrets \
            .#evalTestReportText --raw --show-trace

          result="$(nix --accept-flake-config --quiet eval \
            --override-input mysecrets path:./ci/mysecrets \
            .#evalTests --show-trace)"
          if [ "$result" != "true" ]; then
            echo "Evaluation tests failed. Inspect details with:"
            echo "  nix eval .#evalTestResults --show-trace"
            exit 1
          fi

      - name: Check all flake outputs
        run: |
          nix --accept-flake-config flake check \
            --override-input mysecrets path:./ci/mysecrets \
            --all-systems --no-build --show-trace
