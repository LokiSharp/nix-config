name: Nix Flake Eval Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"

jobs:
  checks:
    name: Check expressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Nix Flake Eval Tests
        run: |
          nix --quiet eval .#evalTestReportText --raw --show-trace

          result="$(nix --quiet eval .#evalTests --show-trace)"
          if [ "$result" != "true" ]; then
            echo "Evaluation tests failed. Inspect details with:"
            echo "  nix eval .#evalTestResults --show-trace"
            exit 1
          fi

      - name: Check all flake outputs
        run: nix flake check --all-systems --no-build --show-trace
