name: Nix Flake Eval Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check expressions
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-eval-v1-${{ runner.os }}-${{ hashFiles('flake.lock', 'ci/mysecrets/**') }}
          restore-prefixes-first-match: nix-eval-v1-${{ runner.os }}-

      - name: Run Nix Flake Eval Tests
        run: |
          nix --accept-flake-config --quiet eval \
            --override-input mysecrets path:./ci/mysecrets \
            .#evalTestReportText --raw --show-trace

          result="$(nix --accept-flake-config --quiet eval \
            --override-input mysecrets path:./ci/mysecrets \
            .#evalTests --show-trace)"
          if [ "$result" != "true" ]; then
            echo "Evaluation tests failed. Inspect details with:"
            echo "  nix eval .#evalTestResults --show-trace"
            exit 1
          fi

      - name: Check all flake outputs
        run: |
          nix --accept-flake-config flake check \
            --override-input mysecrets path:./ci/mysecrets \
            --all-systems --no-build --show-trace

      - name: Run repository checks
        run: |
          nix --accept-flake-config build \
            --override-input mysecrets path:./ci/mysecrets \
            .#checks.x86_64-linux.format \
            .#checks.x86_64-linux.statix \
            .#checks.x86_64-linux.deadnix \
            .#checks.x86_64-linux.secrets-schema \
            .#checks.x86_64-linux.secrets-manifests \
            .#checks.x86_64-linux.deployment-rollout \
            .#checks.x86_64-linux.deployment-ssh-resilience \
            --no-link --print-build-logs

      - name: Build representative NixOS systems
        run: |
          nix --accept-flake-config build \
            --override-input mysecrets path:./ci/mysecrets \
            .#nixosConfigurations.Server-NixOS.config.system.build.toplevel \
            .#nixosConfigurations.Vultr-JP.config.system.build.toplevel \
            .#nixosConfigurations.VM-NixOS.config.system.build.toplevel \
            --no-link --print-build-logs
